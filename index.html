<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishes from Special Events</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff5f7, #fffaf0, #f4f8ff);
      color: #333;
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 40px auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
    }

    h1 {
      text-align: center;
      margin: 0 0 12px;
      color: #8b4a62;
      font-size: 32px;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .music {
      background: #fff4f7;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 28px;
      text-align: center;
    }

    .music span {
      display: block;
      margin-bottom: 10px;
      color: #75445a;
      font-weight: 600;
    }

    audio {
      width: 100%;
      max-width: 500px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #5f4350;
    }

    .name-input,
    textarea {
      width: 100%;
      border: 1px solid #e1cbd3;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }

    .name-input:focus,
    textarea:focus {
      border-color: #b97991;
      box-shadow: 0 0 0 3px rgba(185, 121, 145, 0.12);
    }

    .name-input {
      margin-bottom: 22px;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }

    .counter {
      text-align: right;
      font-size: 13px;
      color: #888;
      margin-top: 6px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 18px 0 25px;
    }

    .category-btn {
      border: 1px solid #e4cbd3;
      background: #fff;
      color: #684858;
      padding: 13px 10px;
      border-radius: 13px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .category-btn:hover {
      transform: translateY(-1px);
      background: #fff4f7;
    }

    .category-btn.active {
      background: #8b4a62;
      color: white;
      border-color: #8b4a62;
    }

    .send-btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      background: #8b4a62;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: #71394e;
    }

    .send-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .result.success {
      display: block;
      background: #eef9f0;
      color: #28633a;
      border: 1px solid #c8e8cf;
    }

    .result.error {
      display: block;
      background: #fff0f0;
      color: #9b3030;
      border: 1px solid #efcaca;
    }

    .privacy {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin: 20px auto;
      }

      .card {
        padding: 23px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }

      .categories {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>💌 Wishes from Special Events</h1>

      <p class="intro">
        Share a heartfelt message for someone's special moment.
        Choose an occasion below and leave your beautiful wish.
      </p>


      <!-- MUSIC -->
      <div class="music" id="music">
        <span>🎵 Add a little music to the moment</span>

        <audio controls preload="metadata">
          <source src="song.mp3" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>
      </div>


      <!-- FORM -->
      <form id="wishForm">

        <!-- Visitor name -->
        <label for="userName">Your name (optional)</label>

        <input
          class="name-input"
          type="text"
          id="userName"
          name="name"
          maxlength="80"
          placeholder="Your name (optional)"
        >


        <!-- Category -->
        <label>Choose an occasion</label>

        <div class="categories">

          <button
            type="button"
            class="category-btn active"
            data-category="Birthday"
          >
            🎂 Birthday
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="Anniversary"
          >
            💕 Anniversary
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="Festival"
          >
            🪔 Festival
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="Hidden Proposal"
          >
            💍 Hidden Proposal
          </button>

          <button
            type="button"
            class="category-btn"
            data-category="General"
          >
            💌 General
          </button>

        </div>


        <!-- Hidden fields -->
        <input
          type="hidden"
          id="categoryField"
          name="category"
          value="Birthday"
        >

        <input
          type="hidden"
          id="subjectField"
          name="_subject"
          value="🎂 BIRTHDAY WISH — New Submission"
        >

        <input
          type="hidden"
          id="visitorField"
          name="visitor_id"
        >

        <input
          type="hidden"
          id="submissionField"
          name="submission_id"
        >


        <!-- Message -->
        <label for="message">Your wish</label>

        <textarea
          id="message"
          name="message"
          maxlength="500"
          placeholder="Write your birthday wish here..."
          required
        ></textarea>

        <div class="counter">
          <span id="count">0</span>/500
        </div>


        <!-- Send -->
        <button
          class="send-btn"
          id="send"
          type="submit"
        >
          💌 Send My Wish
        </button>

      </form>


      <!-- Result -->
      <div
        class="result"
        id="result"
      ></div>


      <div class="privacy">
        Your message is sent securely through Formspree.
      </div>

    </div>

  </div>


  <script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const form = document.getElementById("wishForm");
    const textarea = document.getElementById("message");
    const count = document.getElementById("count");
    const send = document.getElementById("send");
    const result = document.getElementById("result");

    const categoryButtons =
      document.querySelectorAll(".category-btn");

    const categoryField =
      document.getElementById("categoryField");

    const subjectField =
      document.getElementById("subjectField");

    const visitorField =
      document.getElementById("visitorField");

    const submissionField =
      document.getElementById("submissionField");


    /* =========================================
       CATEGORY SETTINGS
    ========================================= */

    const categorySettings = {

      "Birthday": {
        placeholder: "Write your birthday wish here...",
        button: "🎂 Send Birthday Wish",
        subject: "🎂 BIRTHDAY WISH — New Submission"
      },

      "Anniversary": {
        placeholder: "Write your anniversary wish here...",
        button: "💕 Send Anniversary Wish",
        subject: "💕 ANNIVERSARY WISH — New Submission"
      },

      "Festival": {
        placeholder: "Write your festival wish here...",
        button: "🪔 Send Festival Wish",
        subject: "🪔 FESTIVAL WISH — New Submission"
      },

      "Hidden Proposal": {
        placeholder: "Write your special proposal message here...",
        button: "💍 Send Special Message",
        subject: "💍 HIDDEN PROPOSAL — New Submission"
      },

      "General": {
        placeholder: "Write your special message here...",
        button: "💌 Send My Wish",
        subject: "💌 GENERAL WISH — New Submission"
      }

    };


    /* =========================================
       CATEGORY BUTTONS
    ========================================= */

    categoryButtons.forEach(function(button) {

      button.addEventListener("click", function() {

        categoryButtons.forEach(function(btn) {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        const category =
          button.getAttribute("data-category");

        const settings =
          categorySettings[category];

        categoryField.value = category;

        subjectField.value = settings.subject;

        textarea.placeholder = settings.placeholder;

        send.textContent = settings.button;

      });

    });


    /* =========================================
       CHARACTER COUNTER
    ========================================= */

    textarea.addEventListener("input", function() {

      count.textContent = textarea.value.length;

    });


    /* =========================================
       CREATE VISITOR ID
    ========================================= */

    function createVisitorID() {

      const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      let randomPart = "";

      for (let i = 0; i < 8; i++) {

        randomPart +=
          characters.charAt(
            Math.floor(
              Math.random() * characters.length
            )
          );

      }

      return "WF-" + randomPart;

    }


    let visitorID =
      localStorage.getItem("wishesVisitorID");


    if (!visitorID) {

      visitorID = createVisitorID();

      localStorage.setItem(
        "wishesVisitorID",
        visitorID
      );

    }


    visitorField.value = visitorID;


    /* =========================================
       CREATE UNIQUE SUBMISSION ID
    ========================================= */

    function createSubmissionID() {

      const randomBytes =
        new Uint8Array(6);

      crypto.getRandomValues(randomBytes);

      const randomPart =
        Array.from(randomBytes)
          .map(function(byte) {

            return byte
              .toString(16)
              .padStart(2, "0");

          })
          .join("")
          .toUpperCase();

      const timePart =
        Date.now()
          .toString(36)
          .toUpperCase();

      return "SUB-" +
        timePart +
        "-" +
        randomPart;

    }


    /* =========================================
       FORM SUBMISSION
    ========================================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const wish =
          textarea.value.trim();


        if (!wish) {

          result.className =
            "result error";

          result.textContent =
            "Please write a wish before sending.";

          return;

        }


        /* Create a new unique ID
           for THIS submission */

        const submissionID =
          createSubmissionID();

        submissionField.value =
          submissionID;


        send.disabled = true;

        send.textContent =
          "Sending your wish...";


        result.style.display = "none";


        try {

          /* =====================================
             FORMSPREE
          ===================================== */

          const response =
            await fetch(
              "https://formspree.io/f/xdeoqppz",
              {
                method: "POST",

                body: new FormData(form),

                headers: {
                  "Accept": "application/json"
                }
              }
            );


          const data =
            await response
              .json()
              .catch(function() {
                return {};
              });


          if (!response.ok) {

            console.error(
              "Formspree error:",
              data
            );

            let errorMessage =
              "Form submission failed.";

            if (
              data &&
              Array.isArray(data.errors) &&
              data.errors.length > 0
            ) {

              errorMessage =
                data.errors
                  .map(function(error) {
                    return error.message;
                  })
                  .join(", ");

            }

            throw new Error(errorMessage);

          }


          /* =====================================
             SUCCESS MESSAGE
          ===================================== */

          result.className =
            "result success";

          result.innerHTML =
            "💌 <strong>Your wish was sent successfully!</strong><br><br>" +
            "Your Submission ID:<br>" +
            "<strong>" +
            submissionID +
            "</strong><br><br>" +
            "Please keep this ID if you need to refer to your wish later.";


          result.style.display = "block";


          /* Clear message */

          textarea.value = "";

          count.textContent = "0";


        } catch (error) {

          console.error(error);


          result.className =
            "result error";

          result.textContent =
            "Something went wrong while sending your wish.\n\n" +
            error.message;

          result.style.display = "block";

        } finally {

          send.disabled = false;


          const currentCategory =
            categoryField.value;

          send.textContent =
            categorySettings[currentCategory].button;

        }

      }
    );

  </script>

</body>
</html>
